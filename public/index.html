<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordLink</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
<nav class="fx w ac">
    <div class="nav-header"><h2>WordLink</h2></div>
    <ul class="fx w ha gp1">
        <li class="wa ha"><button class="ifx p04 gp04 wa ha btn ac" data-screen="home-screen"><span id="home-icon" class="icon"></span><span>HOME</span></button></li>
        <li class="wa"><button class="ifx p04 gp04 wa ha btn ac" data-screen="chain-list-screen"><span id="chain-list-icon" class="icon"></span><span>LISTS</span></button></li>
        <li class="wa"><button class="ifx p04 gp04 wa ha btn ac" data-screen="lobby-list-screen"><span id="lobby-list-icon" class="icon"></span><span>LOBBIES</span></button></li>
        <li class="wa"><button class="ifx p04 gp04 wa ha btn ac" data-screen="profile-screen"><span id="profile-icon" class="icon"></span><span>PROFILE</span></button></li>
    </ul>
</nav>
<main>
    <section id="home-screen" class="screen"><h1>Home</h1><div id="home-screen-content"></div></section>
    <section id="chain-list-screen" class="screen" hidden><h1>Chain Lists</h1><div id="chain-list-screen-content"></div></section>
    <section id="chain-list-edit-screen" class="screen" hidden><h1>Chain Editor</h1><div id="chain-list-edit-screen-content"></div></section>
    <section id="lobby-list-screen" class="screen" hidden><h1>Lobbies</h1><div id="lobby-list-screen-content"></div></section>
    <section id="profile-screen" class="screen" hidden><h1>Profile</h1><div id="profile-screen-content"></div></section>
    <section id="lobby-screen" class="screen" hidden><h1>Pre-Game Lobby</h1><div id="lobby-screen-content"></div></section>
    <section id="game-screen" class="screen" hidden><h1>Live Game</h1><div id="game-screen-content"></div></section>
    <section id="result-screens" class="screen" hidden><h1>Game Results</h1><div id="results-screen-content"></div></section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
